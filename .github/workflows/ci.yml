name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and optional dependencies
        run: python -m pip install ".[all]"
      - name: Check command-line entry points
        run: |
          python registry_parallel_pull.py --help
          docker-image-downloader --help
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify archive with Docker Engine
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          TEST_DOCKER_LOAD: '1'
        run: python -m unittest discover -s tests -p test_integration.py -v
